name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hatoba/desktop typecheck
      - run: pnpm --filter @hatoba/desktop test
      - run: pnpm --filter @hatoba/desktop build

  worker:
    name: Sync Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/sync/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust-linux:
    name: Rust (Linux, SSH integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev openssh-server openssh-client
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build frontend (embedded by tauri::generate_context!)
        run: pnpm install --frozen-lockfile && pnpm --filter @hatoba/desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (incl. OpenSSH integration tests)
        run: cargo test --workspace
        env:
          HATOBA_SSH_IT: "1"

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hatoba/desktop build
      - run: cargo test -p hatoba-core -p hatoba-ssh -p hatoba-desktop
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: hatoba-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: warn
