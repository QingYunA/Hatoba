<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:44px;box-sizing:border-box;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:0.5px solid var(--line);background:var(--win);color:var(--fg);user-select:none">
<sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:7px;background:{{ tb.bg }};color:{{ tb.fg }};font-size:12.5px;font-weight:{{ tb.weight }};min-width:0;max-width:200px" style-hover="background:var(--fill)">
<sc-if value="{{ tb.isHome }}" hint-placeholder-val="{{ false }}"><i class="ph {{ tb.icon }}" style="font-size:15px"></i></sc-if>
<sc-if value="{{ tb.dot }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:50%;flex:none;background:{{ tb.dot }}"></span></sc-if>
<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ tb.label }}</span>
<sc-if value="{{ tb.closable }}" hint-placeholder-val="{{ false }}"><i class="ph ph-x" style="font-size:11px;color:var(--fg2);margin-left:4px"></i></sc-if>
</div>
<sc-if value="{{ tb.sep }}" hint-placeholder-val="{{ false }}"><span style="width:0.5px;height:16px;background:var(--line2);margin:0 5px;flex:none"></span></sc-if>
</sc-for>
<div style="width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:7px;color:var(--fg2)" style-hover="background:var(--fill)"><i class="ph ph-plus" style="font-size:14px"></i></div>
<div style="flex:1"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:972,&quot;height&quot;:44},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;tokyo&quot;,&quot;osaka&quot;,&quot;staging&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;homeLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;All Hosts&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;homeIcon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ph-hard-drives&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;noSessions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;withStaging&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, a = p.active || 'home';
    const tabs = [{ key: 'home', label: p.homeLabel || '', icon: p.homeIcon || 'ph-hard-drives', isHome: true, sep: !p.noSessions }];
    if (!p.noSessions) tabs.push({ key: 'tokyo', label: 'prod-api-tokyo', dot: 'var(--green)' }, { key: 'osaka', label: 'db-osaka-01', dot: 'var(--green)' });
    if (p.withStaging) tabs.push({ key: 'staging', label: 'staging-web-02', dot: 'var(--red)' });
    return { tabs: tabs.map(t => ({ ...t, bg: t.key === a ? 'var(--fill2)' : 'transparent', fg: t.key === a ? 'var(--fg)' : 'var(--fg2)', weight: t.key === a ? 500 : 400, closable: t.key === a && !t.isHome })) };
  }
}
</script>
</body>
</html>
