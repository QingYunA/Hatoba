<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:228px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:var(--side);backdrop-filter:blur(36px) saturate(1.7);-webkit-backdrop-filter:blur(36px) saturate(1.7);border-right:0.5px solid var(--line2);color:var(--fg);font-size:13px;user-select:none">
<div style="height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 0 18px">
<span style="width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.18)"></span>
<span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.18)"></span>
<span style="width:12px;height:12px;border-radius:50%;background:#28C840;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.18)"></span>
<div style="flex:1"></div>
<i class="ph ph-sidebar-simple" style="font-size:16px;color:var(--fg2)"></i>
</div>
<div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px;padding-top:4px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
<sc-if value="{{ r.isHeader }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;padding:14px 20px 5px;font-size:11px;font-weight:600;color:var(--fg2)"><span style="flex:1">{{ r.label }}</span><sc-if value="{{ r.plus }}" hint-placeholder-val="{{ false }}"><i class="ph ph-plus" style="font-size:12px"></i></sc-if></div>
</sc-if>
<sc-if value="{{ r.isNote }}" hint-placeholder-val="{{ false }}">
<div style="padding:3px 20px 3px 46px;font-size:12px;color:var(--fg3)">{{ r.label }}</div>
</sc-if>
<sc-if value="{{ r.isItem }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;margin:0 10px;border-radius:6px;background:{{ r.bg }}">
<i class="ph {{ r.icon }}" style="font-size:16px;width:18px;text-align:center;color:{{ r.ic }}"></i>
<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.label }}</span>
<span style="font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums">{{ r.count }}</span>
</div>
</sc-if>
<sc-if value="{{ r.isTag }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;margin:0 10px;border-radius:6px;background:{{ r.bg }}">
<span style="width:18px;display:flex;justify-content:center"><span style="width:8px;height:8px;border-radius:50%;background:{{ r.color }}"></span></span>
<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.label }}</span>
<span style="font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums">{{ r.count }}</span>
</div>
</sc-if>
</sc-for>
</div>
<div style="flex:none;display:flex;align-items:center;gap:9px;height:48px;padding:0 12px 0 18px;border-top:0.5px solid var(--line)">
<i class="ph {{ syncIcon }}" style="font-size:16px;color:{{ syncColor }}"></i>
<div style="flex:1;min-width:0;line-height:1.3"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ syncText }}</div><div style="font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ syncSub }}</div></div>
<div title="{{ lockLabel }}" style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--fg2)" style-hover="background:var(--fill)"><i class="ph ph-lock-simple" style="font-size:15px"></i></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:228,&quot;height&quot;:720},&quot;s&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,string&gt;&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sync&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;synced&quot;,&quot;syncing&quot;,&quot;conflict&quot;,&quot;offline&quot;,&quot;none&quot;],&quot;default&quot;:&quot;synced&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.s || {};
    const a = this.props.active || 'all';
    const empty = !!this.props.empty;
    const it = (key, icon, label, count) => ({ key, icon, label, count: empty && count !== '' ? '0' : count, isItem: true });
    const tag = (key, color, count) => ({ key, label: key, color, count, isTag: true });
    let rows = [
      it('all', 'ph-hard-drives', s.all, '11'),
      it('fav', 'ph-star', s.fav, '4'),
      it('recent', 'ph-clock-counter-clockwise', s.recent, ''),
      { isHeader: true, label: s.groups, plus: true }
    ];
    if (empty) rows.push({ isNote: true, label: s.noGroups });
    else rows.push(
      it('g-tokyo', 'ph-folder-simple', s.g_tokyo, '3'),
      it('g-osaka', 'ph-folder-simple', s.g_osaka, '2'),
      it('g-staging', 'ph-folder-simple', 'Staging', '2'),
      it('g-infra', 'ph-folder-simple', s.g_infra, '2'),
      it('g-home', 'ph-folder-simple', s.g_home, '2'),
      { isHeader: true, label: s.tags },
      tag('production', 'oklch(0.66 0.15 30)', '5'),
      tag('staging', 'oklch(0.76 0.13 80)', '2'),
      tag('database', 'oklch(0.6 0.13 300)', '2'),
      tag('edge', 'oklch(0.68 0.1 190)', '2')
    );
    rows.push({ isHeader: true, label: s.vault }, it('keys', 'ph-key', s.keys, '5'), it('sync', 'ph-cloud', s.sync, ''));
    rows = rows.map(r => (r.isItem || r.isTag) ? { ...r, bg: r.key === a ? 'var(--sel)' : 'transparent', ic: r.key === a ? 'var(--accent)' : 'var(--fg2)' } : r);
    const st = this.props.sync || 'synced';
    const M = { synced: ['ph-cloud-check', 'var(--green)'], syncing: ['ph-arrows-clockwise', 'var(--accent)'], conflict: ['ph-warning-circle', 'var(--orange)'], offline: ['ph-cloud-slash', 'var(--fg2)'], none: ['ph-cloud', 'var(--fg2)'] };
    const m = M[st] || M.synced;
    return { rows, syncIcon: m[0], syncColor: m[1], syncText: s['sy_' + st], syncSub: s['sy_' + st + '_sub'], lockLabel: s.lock };
  }
}
</script>
</body>
</html>
